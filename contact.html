<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <!---------------NAV BAR----------------->
    <div class="navBar-Wrapper">

        </div>

    </div>
    <!------------FOOTER----------->
    <footer>
        <div id="copyright">
            <p>© 2023 by Mustacchio. All rights reserved.</p>
        </div>
        <div id="socials">
            <img src="images/icons/icon-twitter.jpg">
